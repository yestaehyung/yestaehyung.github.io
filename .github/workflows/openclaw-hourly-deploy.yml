name: OpenClaw Hourly Deploy

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openclaw-hourly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync OpenClaw snapshot
        env:
          OPENCLAW_HOME: ${{ vars.OPENCLAW_HOME }}
        run: |
          if [ -n "${OPENCLAW_HOME}" ] && [ -d "${OPENCLAW_HOME}" ]; then
            echo "OPENCLAW_HOME detected at ${OPENCLAW_HOME}"
            npm run sync:openclaw
          else
            echo "OPENCLAW_HOME is not available on this runner."
            echo "Keeping the existing public/openclaw/agent-feed.json from the repository."
          fi

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: hourly deploy"
